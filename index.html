<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2130">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무편성">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>관제 근무편성표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky control-room header (brand · date · tabs) over a single working column; boards split into three area panels */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface2:#f5f7f9; --ink:#0e2130; --muted:#5b6d7c; --line:#d5dde5;
  --accent:#0a6a86; --accent-ink:#ffffff; --accent-soft:#e0eff4;
  --ok:#2e7a4c; --ok-soft:#e2f2e7; --warn:#9c5c00; --warn-soft:#fbefd8; --bad:#b42a20; --bad-soft:#fbe4e1;
  --t1:#2d5ca6; --t2:#11806f; --t3:#b25e17;
  --day:#b87b0c; --night:#3b4a8f; --full:#0a6a86; --off:#7f8d99;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#121f29; --surface2:#172732; --ink:#e3ecf2; --muted:#93a5b3; --line:#253848;
  --accent:#55b6d3; --accent-ink:#04202a; --accent-soft:#11323f;
  --ok:#6cc48f; --ok-soft:#132e1e; --warn:#e3a64b; --warn-soft:#382810; --bad:#ef7f74; --bad-soft:#3b1916;
  --t1:#82a9ea; --t2:#4fc8b3; --t3:#e79c5c;
  --day:#e6b34a; --night:#9eabee; --full:#55b6d3; --off:#71828f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#121f29; --surface2:#172732; --ink:#e3ecf2; --muted:#93a5b3; --line:#253848;
  --accent:#55b6d3; --accent-ink:#04202a; --accent-soft:#11323f;
  --ok:#6cc48f; --ok-soft:#132e1e; --warn:#e3a64b; --warn-soft:#382810; --bad:#ef7f74; --bad-soft:#3b1916;
  --t1:#82a9ea; --t2:#4fc8b3; --t3:#e79c5c;
  --day:#e6b34a; --night:#9eabee; --full:#55b6d3; --off:#71828f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:7px;right:7px;height:3px;border-radius:2px;background:var(--bg)}
.mark::before{top:10px}.mark::after{top:17px;right:12px;background:var(--accent)}
.brand strong{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.sync.live i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.sync.err i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.adm::after{content:"관리";font-size:10px;font-weight:600;margin-left:4px;padding:1px 4px;border-radius:4px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}

/* date bar */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:14px 4px}
.datebar .dnav{display:flex;align-items:center;gap:4px}
.ibtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.datepick{position:relative;display:flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:15px}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.teamstrip{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.opnote{font-size:12px;color:var(--muted)}

main{padding-block:12px 64px}
.view{display:flex;flex-direction:column;gap:16px}
h2{font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.t1{color:var(--t1);border-color:color-mix(in srgb,var(--t1) 35%,transparent);background:color-mix(in srgb,var(--t1) 9%,var(--surface))}
.pill.t2{color:var(--t2);border-color:color-mix(in srgb,var(--t2) 35%,transparent);background:color-mix(in srgb,var(--t2) 9%,var(--surface))}
.pill.t0{color:var(--ink);border-color:var(--ink);background:var(--surface);font-weight:700}
.adm-team .pchip{cursor:pointer;border-style:solid;gap:6px}.adm-team .pchip .chs{width:22px;height:24px}
.pill.t3{color:var(--t3);border-color:color-mix(in srgb,var(--t3) 35%,transparent);background:color-mix(in srgb,var(--t3) 9%,var(--surface))}
.sh{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;color:var(--surface);white-space:nowrap}
.sh-주간{background:var(--day)}.sh-야간{background:var(--night)}.sh-종일{background:var(--full)}
.sh-비번,.sh-휴일{background:transparent;color:var(--muted);border:1px solid var(--line)}
.flag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.flag.info{background:var(--accent-soft);color:var(--accent)}
.lv{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.lv-senior{background:var(--ink)}.lv-mid{background:var(--accent)}.lv-junior{background:transparent;border:1.5px solid var(--warn)}.lv-null{background:var(--line)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}

/* form */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* my day */
.me-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.me-place{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:6px 0 4px}
.me-place small{font-size:16px;font-weight:600;color:var(--muted);margin-left:6px}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:6px 0 10px 16px}
.tl::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl.on::before{background:var(--accent);border-color:var(--accent)}
.tl .tt{font-family:var(--f-mono);font-size:13px;font-weight:600}
.tl.off .tt{color:var(--muted)}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sec{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.sec b{font-family:var(--f-mono);font-weight:600;margin-right:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){.week{grid-template-columns:1fr}}
.wd{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
@media (max-width:640px){.wd{flex-direction:row;align-items:center;justify-content:space-between}}
.wd.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd .dd{font-size:12.5px;font-weight:600;color:var(--muted)}
.wd .ww{font-size:13px;font-weight:600}
/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal-h.sun,.dn.sun{color:var(--bad)}.cal-h.sat,.dn.sat{color:var(--accent)}
.cd{min-height:86px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;overflow:hidden}
.cd:hover{border-color:var(--muted)}
.cd.other{opacity:.4}
.cd.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cd .dn{font-family:var(--f-mono);font-size:13px;font-weight:600;align-self:flex-start;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.cd.today .dn{background:var(--ink);color:var(--surface)}
.cd .lab{font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:flex-start;max-width:100%}
.cd .pl{font-size:11.5px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-주간 .lab{background:var(--day);color:var(--surface)}
.cd-야간 .lab{background:var(--night);color:var(--surface)}
.cd-종일 .lab{background:var(--full);color:var(--surface)}
.cd-out{background:var(--bad-soft)}.cd-out .lab{color:var(--bad);padding-left:0}
.cd-sub{background:var(--accent-soft)}.cd-sub .lab{color:var(--accent);padding-left:0}
.cd-off .lab{color:var(--muted);font-weight:500;padding-left:0}
.cd-주간 .pl,.cd-야간 .pl,.cd-종일 .pl{color:var(--ink);font-weight:600}
.cal-sum{font-size:13px;color:var(--muted);gap:6px 12px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw-주간{background:var(--day)}.sw-야간{background:var(--night)}.sw-종일{background:var(--full)}
.sw-out{background:var(--bad)}.sw-sub{background:var(--accent)}
@media (max-width:560px){
  .cal{gap:3px}
  .cd{min-height:64px;padding:4px 3px;gap:2px;border-radius:6px}
  .cd .dn{font-size:12px;min-width:20px;height:20px;line-height:20px}
  .cd .lab{font-size:11px;padding:1px 4px}
  .cd-out .lab,.cd-sub .lab,.cd-off .lab{padding-left:1px}
  .cd .pl{font-size:10px;letter-spacing:-.02em}
}

/* board */
.board{display:flex;flex-direction:column;gap:14px}
.board-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.board-head h3{font-size:18px}
.leaders{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.leaders b{color:var(--ink);font-weight:600}
.areas{display:grid;grid-template-columns:3fr 4fr 2fr;gap:12px}
@media (max-width:980px){.areas{grid-template-columns:1fr}}
.area{border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.area-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.area-h h4{margin:0;font-size:15px}
.area-h span{font-size:12px;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.cells{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.cell{min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 9px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.cell[disabled]{cursor:default;opacity:1}
.cell .nm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ds{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.empty{border-style:dashed;color:var(--muted);align-items:center;font-size:13px}
.cell.sub{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft)}
.cell.out{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));background:var(--bad-soft)}
.cell.out .nm{color:var(--bad)}
.cell.me{box-shadow:inset 0 0 0 2px var(--accent)}
.denied{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-size:13.5px;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.denied span{color:var(--ink)}
.hdr-r{display:flex;align-items:center;gap:10px}
.lo{height:30px;padding:0 10px;font-size:12.5px}
.login{display:grid;place-items:center;padding-block:28px 40px}
.login-card{width:min(420px,100%);gap:16px;padding:24px 22px}
.login-brand{display:flex;align-items:center;gap:12px}
.login-brand .mark{width:40px;height:40px;border-radius:10px}
.login-brand .mark::before{top:14px;left:9px;right:9px}.login-brand .mark::after{top:23px;left:9px;right:16px}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;padding:10px 0;font-size:14.5px}
.login .inp{height:46px;font-size:16px}
.btn.big{height:46px;font-size:15.5px}
.err{margin:0;color:var(--bad);font-size:13.5px;font-weight:600}
.pw-box{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
@media (max-width:560px){.inp{font-size:16px}.brand small{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.cell .nm .chs{width:22px;height:24px;flex:none;margin:-3px 0 -3px -2px}
.cell.target{border-color:var(--accent);border-style:dashed;background:var(--accent-soft);color:var(--accent)}
.lineup{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.chr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0;text-align:center;font:inherit;color:inherit}
button.chr{cursor:pointer;transition:transform .12s ease,border-color .12s ease}
button.chr:hover{border-color:var(--accent);transform:translateY(-2px)}
.chr .chs{width:48px;height:53px}
.chr.placed .chs{filter:saturate(.75)}
.chr.unknown{border-style:dashed;opacity:.85}
.chr.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transform:translateY(-2px)}
.chr.me{box-shadow:inset 0 0 0 2px var(--accent)}
.cn{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:16px}
.b{font-style:normal;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap}
.b.lead{background:var(--ink);color:var(--surface)}
.b.sub{background:var(--accent-soft);color:var(--accent)}
.b.unk{background:var(--warn-soft);color:var(--warn)}
.b.pos{background:var(--ok-soft);color:var(--ok)}
.b.none{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pickhint{margin:0;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px;align-self:flex-start}
@media (prefers-reduced-motion:no-preference){.chr{animation:pop .3s ease-out both;animation-delay:calc(var(--i,0)*18ms)}@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}}
@media (max-width:560px){.chars{grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}.chr .chs{width:40px;height:44px}.cn{font-size:12px}}
.cell .sc{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.cell.empty.has-sc{align-items:flex-start}
.sec-set{padding-top:12px;border-top:1px solid var(--line)}
.sec-set:first-of-type{padding-top:0;border-top:0}
.sec-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);background:var(--surface)}
.note-box{white-space:pre-wrap;font-size:14px;background:var(--surface2);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
details.rot{border-top:1px solid var(--line);padding-top:10px}
details.rtab td,.rtab th{text-align:center;padding:5px 6px}.rtab td.tm{text-align:left}.rtab td.rest{text-align:left;color:var(--muted);font-size:12px;white-space:normal;min-width:120px}
.rot summary{cursor:pointer;font-weight:600;font-size:14px}
.tscroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.blk td{background:var(--surface2);font-weight:700;font-size:12px;color:var(--muted)}

/* status */
.stat-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:15px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.dlist{display:flex;flex-direction:column}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl .who{min-width:0}
.dl .who b{font-weight:600}
.arrow{color:var(--muted);margin:0 4px}
table.month td{cursor:pointer}
table.month tr:hover td{background:var(--surface2)}
table.month tr.cur td{background:var(--accent-soft)}
.mc{display:inline-flex;align-items:center;gap:4px}
.short{font-family:var(--f-mono);font-weight:600;font-size:12px}
.short.bad{color:var(--bad)}.short.ok{color:var(--ok)}

/* people */
.ptable td{cursor:pointer}
.ptable tr:hover td{background:var(--surface2)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:22px 16px;border:2px dashed var(--line);border-radius:var(--r);background:var(--surface2);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px;color:var(--accent)}
.sample-t td,.sample-t th{padding:4px 8px;font-size:12px}
.sample-t td{color:var(--muted)}
@media (max-width:560px){.sync span{display:none}.hdr-r{gap:6px}.brand{min-width:0;flex:1}}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:5}
.selbar.on{border-color:var(--accent);background:var(--accent-soft)}
.selcount{font-size:14px}.selcount b{font-size:17px;color:var(--accent)}
.selnames{font-size:13px;color:var(--muted);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selact{margin-left:auto}
.ptable th.ck,.ptable td.ck{width:36px;padding-right:0}
.ptable input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.ptable tr.picked td{background:var(--accent-soft)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}

/* empty */
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty-state h3{color:var(--ink);margin-bottom:6px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,22,.45)}
.sheet-panel{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:14px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left}
.opt:hover{border-color:var(--accent)}
.opt .l{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.opt .r{font-size:12px;color:var(--muted);white-space:nowrap}
.optlist{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet-panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><strong>관제 근무편성</strong><small id="who">연결 중…</small></div></div>
    <div class="hdr-r"><div class="sync" id="sync"><i></i><span>연결 중</span></div><button class="btn sm lo" id="pwBtn" data-act="chpw" hidden>비밀번호</button><button class="btn sm lo" id="logoutBtn" data-act="logout" hidden>로그아웃</button></div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="화면"></nav>
</header>
<main class="wrap" id="main">
  <div class="empty-state"><h3>근무편성표를 불러오는 중입니다</h3><p>오늘 근무 구역, 팀별 편성, 대직 현황이 이곳에 표시됩니다.</p></div>
</main>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(()=>{
'use strict';
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]||1,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mod=(a,n)=>((a%n)+n)%n;
const WD=['일','월','화','수','목','금','토'];
const fmtD=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'};
const fmtShort=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+WD[d.getDay()]};
const fmtT=m=>(m>=1440?'익일 ':'')+pad(Math.floor((m%1440)/60))+':'+pad(m%60);
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
function opDate(){const n=new Date();if(n.getHours()<9)n.setDate(n.getDate()-1);return ymd(n)}
const realToday=ymd(new Date());
function lsGet(k){try{return localStorage.getItem('roster:'+k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem('roster:'+k):localStorage.setItem('roster:'+k,v)}catch(e){}}
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- domain constants ---------- */
const AREAS=[{k:'mokpo',n:'목포구역',per:3},{k:'jindo',n:'진도구역',per:4},{k:'sinan',n:'신안구역',per:2}];
const GROUPS=['1','2'];
const CYCLE=['주간','종일','비번','휴일','야간','비번'];
const SHIFT_TIME={'주간':'09:00–18:00','야간':'18:00–익일 09:00','종일':'09:00–익일 09:00'};
const SHIFT_ORDER={'주간':0,'종일':1,'야간':2};
const KINDS=[
  {k:'연가',cat:'연가',label:'연가'},
  {k:'교육훈련',cat:'기본',label:'교육훈련'},
  {k:'특별휴가',cat:'기본',label:'특별휴가'},
  {k:'결원',cat:'기본',label:'결원(현원 부족)'},
  {k:'기타',cat:'기본',label:'기타'}];
const kindCat=k=>(KINDS.find(x=>x.k===k)||{cat:'기본'}).cat;
const ROLES=['정팀장','부팀장','근무자'];
const ADMIN_ROLES=['슈퍼관리자','행정'];
const ROLE_ORDER={'슈퍼관리자':0,'행정':1,'정팀장':0,'부팀장':1,'근무자':2};
const TEAMS_ALL=[0,1,2,3];const teamName=t=>+t===0?'행정팀':t+'팀';
const isSuper=m=>!!m&&m.active!==false&&m.role==='슈퍼관리자';
const hasSuper=()=>Object.values(S.members).some(isSuper);
const canManage=()=>S.admin;
const LV={junior:'신규',mid:'일반',senior:'숙련'};
const DEF={anchorDate:'2026-10-25',dayTeam:1,nightTeam:3,quota:20,need:18,junior:1,senior:5,sectors:['1섹터','2섹터','3섹터'],sectorsJindo:['4섹터','5섹터','6섹터','7섹터'],sectorsSinan:['8섹터','9섹터']};
const SECTOR_SETS=[{k:'sectors',area:'목포구역',key:'mokpo',n:3,start:1,id:'sSec',note:'근무자가 섹터를 순환합니다'},{k:'sectorsJindo',area:'진도구역',key:'jindo',n:4,start:4,id:'sSecJ',note:'조별 자리 순서대로 담당 섹터가 정해집니다'},{k:'sectorsSinan',area:'신안구역',key:'sinan',n:2,start:8,id:'sSecS',note:'조별 자리 순서대로 담당 섹터가 정해집니다'}];

/* ---------- state ---------- */
const S={db:null,user:null,admin:false,live:false,failed:false,
  members:{},careers:{},config:clone(DEF),duties:[],assigns:{},
  date:opDate(),tab:'me',me:lsGet('me'),dutyMonth:opDate().slice(0,7),meMonth:opDate().slice(0,7),peopleTeam:'all',
  sheet:null,form:null,busy:'',armed:null,plans:{},planYm:null,planUp:{},pick:null,sel:{},bulkTeam:1,logins:{},users:{},profile:null,authReady:false,needSetup:false,session:null,canEdit:false,loaded:false,login:{mode:'worker',name:'',err:''}};
const cutoff=addDays(opDate(),-150);

/* ---------- members & careers ---------- */
const mem=id=>S.members[id];
const nameOf=id=>id?(S.members[id]?S.members[id].name:'(삭제된 인원)'):'—';
const ordOf=x=>{const m=typeof x==='string'?S.members[x]:x;return m&&m.order!=null?+m.order:9999};
const bySenior=(a,b)=>((expYears(b)??-1)-(expYears(a)??-1))||(ordOf(a)-ordOf(b));
const byRole=(a,b)=>((ROLE_ORDER[a.role]??3)-(ROLE_ORDER[b.role]??3))||(ordOf(a)-ordOf(b))||String(a.name).localeCompare(String(b.name),'ko');
const activeMembers=()=>Object.values(S.members).filter(m=>m.active!==false);
const teamMembers=t=>activeMembers().filter(m=>+m.team===+t).sort(byRole);
const workers=t=>teamMembers(t).filter(m=>m.role==='근무자');
const leaders=t=>teamMembers(t).filter(m=>m.role!=='근무자');
function expYears(id){const c=S.careers[id];if(!c||!isDate(c.start))return null;return Math.max(0,diffDays(c.start,realToday)/365.25+(Number(c.prior)||0)/12)}
function level(id){const y=expYears(id);if(y==null)return null;return y<+S.config.junior?'junior':y<+S.config.senior?'mid':'senior'}
function expLabel(id){const y=expYears(id);if(y==null)return '경력 미입력';const yy=Math.floor(y),mm=Math.floor((y-yy)*12);return yy?yy+'년 '+mm+'개월':mm+'개월'}
const lvDot=id=>S.admin?'<span class="lv lv-'+(level(id)||'null')+'" title="'+esc(level(id)?LV[level(id)]+' · '+expLabel(id):'경력 미입력')+'"></span>':'';
const teamPill=t=>'<span class="pill t'+esc(t)+'">'+esc(teamName(t))+'</span>';

/* ---------- shift pattern ---------- */
function teamStatus(t,d){const c=S.config;const off=+t===+c.dayTeam?0:+t===+c.nightTeam?4:2;return CYCLE[mod(diffDays(c.anchorDate,d)+off,6)]}
const isWork=s=>s==='주간'||s==='종일'||s==='야간';
const workingTeams=d=>[1,2,3].filter(t=>isWork(teamStatus(t,d))).sort((a,b)=>SHIFT_ORDER[teamStatus(a,d)]-SHIFT_ORDER[teamStatus(b,d)]);
const shBadge=s=>'<span class="sh sh-'+esc(s)+'">'+esc(s)+'</span>';

/* ---------- duties (대직) ---------- */
const dutiesOn=d=>S.duties.filter(x=>x.date===d);
const outDuty=(d,mid)=>S.duties.find(x=>x.date===d&&x.mid===mid);
const subDuties=(d,mid)=>S.duties.filter(x=>x.date===d&&x.subId===mid);
const dutyTeam=x=>x.mid&&S.members[x.mid]?+S.members[x.mid].team:+x.team;
function roster(d,t){
  const base=workers(t),outs=[],avail=[];
  base.forEach(m=>{const o=outDuty(d,m.id);if(o)outs.push(o);else avail.push(m.id)});
  const ins=dutiesOn(d).filter(x=>x.subId&&dutyTeam(x)===+t);
  ins.forEach(x=>{if(!avail.includes(x.subId))avail.push(x.subId)});
  const vacDuties=dutiesOn(d).filter(x=>!x.mid&&+x.team===+t);
  return {base,outs,ins,avail,vacDuties,headcount:teamMembers(t).length};
}
function subConflict(d,sid,exceptId){
  if(!sid||!mem(sid))return '';
  const own=teamStatus(mem(sid).team,d);
  if(isWork(own))return '본인 근무일('+own+')';
  if(subDuties(d,sid).filter(x=>x.id!==exceptId).length)return '같은 날 대직 중복';
  if(outDuty(d,sid))return '본인 결원 처리됨';
  return '';
}

/* ---------- assignments (편성) ---------- */
function emptySlots(){const o={};AREAS.forEach(a=>{o[a.k]={};GROUPS.forEach(g=>{o[a.k][g]=Array(a.per).fill(null)})});return o}
function normSlots(s){const e=emptySlots();if(!s)return e;AREAS.forEach(a=>GROUPS.forEach(g=>{const arr=(s[a.k]&&s[a.k][g])||[];for(let i=0;i<a.per;i++)e[a.k][g][i]=arr[i]||null}));return e}
function resolveCell(d,id){if(!id)return {id:null,shown:null};const o=outDuty(d,id);if(o)return o.subId?{id,shown:o.subId,tag:'sub',duty:o}:{id,shown:null,tag:'out',duty:o};return {id,shown:id}}
function resolved(d,t){const doc=S.assigns[d+'_'+t]||null;const slots=normSlots(doc&&doc.slots);const res={};AREAS.forEach(a=>{res[a.k]={};GROUPS.forEach(g=>{res[a.k][g]=slots[a.k][g].map(id=>resolveCell(d,id))})});return {doc,slots,res}}
function shownIds(res){const o=[];AREAS.forEach(a=>GROUPS.forEach(g=>res[a.k][g].forEach(c=>{if(c.shown)o.push(c.shown)})));return o}
function groupIssue(cells){
  if(!S.admin)return null;
  const ids=cells.map(c=>c.shown).filter(Boolean);if(ids.length<2)return null;
  const lv=ids.map(level);
  if(lv.every(l=>l==='junior'))return {sev:'bad',msg:'신규끼리 배치'};
  if(!lv.includes('senior')&&!lv.includes(null))return {sev:'warn',msg:'숙련자 없음'};
  return null;
}
function autoAssign(d,t,only){
  const r=roster(d,t);
  const ids=[...(only||r.avail)].sort(bySenior);
  const G=[];AREAS.forEach(a=>GROUPS.forEach(g=>G.push({a:a.k,g,cap:a.per,list:[],sum:0,rs:0})));
  ids.forEach(id=>{const open=G.filter(x=>x.list.length<x.cap);if(!open.length)return;
    open.sort((x,y)=>(x.list.length/x.cap)-(y.list.length/y.cap)||x.sum-y.sum||y.rs-x.rs||y.cap-x.cap);
    open[0].list.push(id);open[0].sum+=expYears(id)??0;open[0].rs+=ids.indexOf(id)});
  const s=emptySlots();G.forEach(x=>x.list.forEach((id,i)=>{s[x.a][x.g][i]=id}));
  const placed=G.reduce((n,x)=>n+x.list.length,0);
  return {slots:s,placed,left:ids.length-placed};
}
function mokpoPlan(shift){
  const B=[],flip=g=>g==='1'?'2':'1';
  const day=g=>{let t=540;while(t<1080){const e=Math.min(t+120,1080);B.push({s:t,e,g,len:40});t=e;g=flip(g)}return g};
  const night=g=>{let t=1080;while(t<1980){const e=Math.min(t+180,1980);B.push({s:t,e,g,len:60});t=e;g=flip(g)}};
  if(shift==='주간')day('1');else if(shift==='야간')night('1');else night(day('1'));
  return B.map(b=>{const sl=[];for(let k=0,t=b.s;t<b.e;k++,t+=b.len)sl.push({s:t,e:Math.min(t+b.len,b.e),k});return {...b,slots:sl}});
}
function fixedSector(a,i){const set=a==='jindo'?'sectorsJindo':a==='sinan'?'sectorsSinan':null;if(!set)return '';const arr=S.config[set]||DEF[set];return arr[i]||DEF[set][i]||''}
const sectorFor=(i,k)=>(S.config.sectors||DEF.sectors)[(i+k)%3]||((i+k)%3+1)+'섹터';

/* ---------- writes ---------- */
const queues={};
function write(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(e=>{handleErr(e);throw e});queues[path]=p.catch(()=>{});return p}
function handleErr(e){const c=e&&e.code;
  if(c==='permission-denied'||c==='invalid_argument')toast('저장 권한이 없습니다. 편집은 슈퍼관리자만 할 수 있습니다.');
  else if(c==='quota_exceeded')toast('저장 공간이 가득 찼습니다. 지난 기록을 정리해 주세요.');
  else if(c==='resource_exhausted')toast('요청이 많습니다. 잠시 후 다시 시도해 주세요.');
  else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.')}
function saveAssign(d,t,patch){
  const id=d+'_'+t;const cur=S.assigns[id]||{slots:emptySlots(),published:false,note:''};
  const body=clone({...cur,...patch,date:d,team:+t,updatedAt:new Date().toISOString()});
  return write('assign/'+id,()=>S.db.doc('assign/'+id).set(body));
}
async function runBatch(ops,label){
  let done=0;const total=ops.length;
  for(let i=0;i<ops.length;i+=6){
    await Promise.all(ops.slice(i,i+6).map(op=>write(op[0],()=>op[1]===null?S.db.doc(op[0]).delete():S.db.doc(op[0]).set(op[1]))));
    done=Math.min(total,i+6);S.busy=label+' '+done+'/'+total;render();
  }
  S.busy='';render();
}

/* ---------- toast / sheet ---------- */
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2600)}
function openSheet(kind,ctx){S.sheet={kind,...ctx};S.armed=null;renderSheet();$('#sheet').hidden=false}
function closeSheet(){S.sheet=null;S.form=null;$('#sheet').hidden=true}

/* ---------- render ---------- */
let pending=false,rafId=0;
function render(force){
  const ae=document.activeElement;
  if(!force&&ae&&$('#main').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='date'&&ae.type!=='checkbox'){pending=true;return}
  cancelAnimationFrame(rafId);rafId=requestAnimationFrame(doRender);
}
document.addEventListener('focusout',e=>{if(!pending)return;if(!S.session&&e.relatedTarget&&$('#main').contains(e.relatedTarget))return;pending=false;setTimeout(render,0)});
function tabsList(){const t=[['me','내 근무'],['board','편성표'],['status','현황']];if(S.admin)t.push(['duty','대직 관리',1],['people','인원·경력',1]);if(canManage())t.push(['settings','설정',1]);return t}
function doRender(){
  const meM=S.session&&(mem(S.session.mid)||{name:S.profile&&S.profile.name});

function emptyState(t,p,extra){return '<div class="empty-state"><h3>'+esc(t)+'</h3><p>'+esc(p)+'</p>'+(extra||'')+'</div>'}
function dateBar(){

    '<button class="btn sm" data-act="today">오늘</button><span class="opnote">09시 교대 기준 근무일</span>'+
    '<div class="teamstrip">'+strip+'</div></div>';

/* ----- 내 근무 ----- */
function myDay(mid,d){
  const m=mem(mid);if(!m)return null;
  const st=teamStatus(m.team,d),out=outDuty(d,mid),subs=subDuties(d,mid),places=[];
  workingTeams(d).forEach(t=>{const {doc,res}=resolved(d,t);if(!doc||!(doc.published||S.admin))return;
    AREAS.forEach(a=>GROUPS.forEach(g=>res[a.k][g].forEach((c,i)=>{if(c.shown===mid)places.push({t,a,g,i,c,doc,shift:teamStatus(t,d)})})))});
  return {m,st,out,subs,places};
}
function daySummary(info,d){
  if(!info)return '';
  if(info.out)return '<span class="flag bad">'+esc(info.out.kind)+'</span>';
  if(info.places.length){const p=info.places[0];return '<span class="sh sh-'+p.shift+'">'+p.shift+'</span> '+esc(p.a.n.replace('구역',''))+' '+p.g+'조'}
  if(info.subs.length)return '<span class="flag info">대직 근무</span>';
  if(isWork(info.st))return shBadge(info.st)+(info.m.role!=='근무자'?' 팀장':'');
  return shBadge(info.st);
}

  if(!S.admin&&S.session)S.me=S.session.mid;

  if(+mem(S.me).team===0){const mm=mem(S.me);return h+'<div class="card stack"><div class="sub">'+fmtD(S.date)+' · '+esc(mm.name)+'</div><div class="me-place">행정팀<small>'+esc(mm.role)+'</small></div><p class="sub" style="margin:0">행정팀은 교대 근무 편성 대상이 아닙니다. 편성표와 현황 탭에서 각 팀 근무를 확인하세요.</p></div>'}

  }else if(info.places.length){
    const p=info.places[0];
    title=esc(p.a.n)+'<small>'+p.g+'조 · '+(p.i+1)+'번</small>';
    sub=shBadge(p.shift)+' '+SHIFT_TIME[p.shift]+' · '+teamPill(p.t)+(p.c.tag==='sub'?' <span class="flag info">대직 근무 · '+esc(nameOf(p.c.id))+' '+esc(p.c.duty.kind)+'</span>':'')+(!p.doc.published?' <span class="flag warn">공지 전 초안</span>':'');
    const {res}=resolved(S.date,p.t);
    const mates=res[p.a.k][p.g].filter((c,i)=>i!==p.i).map(c=>c.shown?esc(nameOf(c.shown)):'<span class="sub">결원</span>');
    body+='<div class="stack"><h3>같은 조 근무자</h3><p style="margin:0">'+(mates.join(' · ')||'—')+'</p></div>';
    const fl=findLetter(S.date,p.c.shown);if(fl&&fl.doc.rot&&fl.doc.rot[fl.k])body+=rotTimeline(fl);else if(p.a.k==='mokpo')body+=myTimeline(p.shift,p.g,p.i);
    else body+='<div class="stack"><h3>담당 섹터</h3><div class="secs" style="margin:0"><span class="sec" style="font-size:15px;padding:6px 12px"><b>'+esc(p.a.n.replace('구역',''))+'</b>'+esc(fixedSector(p.a.k,p.i))+'</span></div><p class="sub" style="margin:0">'+esc(p.a.n)+'는 1조·2조가 교대로 근무합니다. 세부 교대 시간은 팀장 공지를 따릅니다.</p></div>';
  }else if(findLetter(S.date,m.id)){
    const fl=findLetter(S.date,m.id);const sh=teamStatus(fl.t,S.date);

  }else if(info.subs.length){
    const x=info.subs[0];
    title='대직 근무<small>'+dutyTeam(x)+'팀</small>';
    sub=esc(nameOf(x.mid)||'결원 자리')+' '+esc(x.kind)+' 대신 근무 · '+(isWork(teamStatus(dutyTeam(x),S.date))?shBadge(teamStatus(dutyTeam(x),S.date))+' '+SHIFT_TIME[teamStatus(dutyTeam(x),S.date)]:'');
    body='<p class="sub" style="margin:0">'+dutyTeam(x)+'팀 편성이 공지되면 근무 구역이 여기에 표시됩니다.</p>';

      body='<p class="sub" style="margin:0">팀장이 편성을 공지하면 이 화면에 바로 근무 구역이 나타납니다.</p>'}
  }else{

function calCell(info){
  if(!info)return {cls:'off',lab:'',pl:''};
  if(info.out)return {cls:'out',lab:info.out.kind,pl:info.out.subId?'대직 '+nameOf(info.out.subId):'대직 미정'};
  if(info.places.length){const p=info.places[0];return {cls:p.shift,lab:p.shift,pl:(p.c.tag==='sub'||+p.t!==+info.m.team?'대직·':'')+p.a.n.replace('구역','')+' '+p.g+'조'}}
  if(info.subs.length){const x=info.subs[0];return {cls:'sub',lab:'대직',pl:dutyTeam(x)+'팀 '+teamStatus(dutyTeam(x),x.date)}}
  if(isWork(info.st))return {cls:info.st,lab:info.st,pl:info.m.role!=='근무자'?info.m.role:''};
  return {cls:'off',lab:info.st,pl:''};
}
function meCalendar(m){
  const ym=S.meMonth||S.date.slice(0,7);const first=ym+'-01';const f=parse(first);
  const dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();const lead=f.getDay();const total=Math.ceil((lead+dim)/7)*7;
  const today=opDate();const cnt={'주간':0,'야간':0,'종일':0,out:0,sub:0};
  let cells='';
  for(let i=0;i<total;i++){const d=addDays(first,i-lead);const inMonth=d.slice(0,7)===ym;const info=myDay(m.id,d);const c=calCell(info);
    if(inMonth){if(SHIFT_TIME[c.cls])cnt[c.cls]++;if(c.cls==='out')cnt.out++;if(c.cls==='sub'||c.pl.startsWith('대직·'))cnt.sub++}
    const dow=parse(d).getDay();
    cells+='<button class="cd cd-'+esc(c.cls)+(inMonth?'':' other')+(d===S.date?' sel':'')+(d===today?' today':'')+'" data-act="medate" data-d="'+d+'" aria-label="'+fmtD(d)+' '+esc(c.lab)+' '+esc(c.pl)+'">'+
      '<span class="dn'+(dow===0?' sun':dow===6?' sat':'')+'">'+parse(d).getDate()+'</span>'+
      (c.lab?'<span class="lab">'+esc(c.lab)+'</span>':'')+(c.pl?'<span class="pl">'+esc(c.pl)+'</span>':'')+'</button>'}
  const work=cnt['주간']+cnt['야간']+cnt['종일'];
  return '<div class="card stack cal-card"><div class="row between"><div class="row"><button class="ibtn" data-act="mmonth" data-n="-1" aria-label="이전 달">‹</button><h2 class="num">'+f.getFullYear()+'년 '+(f.getMonth()+1)+'월</h2><button class="ibtn" data-act="mmonth" data-n="1" aria-label="다음 달">›</button></div><button class="btn sm" data-act="metoday">오늘</button></div>'+
    '<div class="row cal-sum"><span class="pill">근무 <b class="num">'+work+'</b>일</span><span class="mc"><span class="sw sw-주간"></span>주간 '+cnt['주간']+'</span><span class="mc"><span class="sw sw-종일"></span>종일 '+cnt['종일']+'</span><span class="mc"><span class="sw sw-야간"></span>야간 '+cnt['야간']+'</span>'+(cnt.out?'<span class="mc"><span class="sw sw-out"></span>휴가·교육 '+cnt.out+'</span>':'')+(cnt.sub?'<span class="mc"><span class="sw sw-sub"></span>대직 근무 '+cnt.sub+'</span>':'')+'</div>'+
    '<div class="cal">'+WD.map((w,i)=>'<span class="cal-h'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</span>').join('')+cells+'</div>'+
    '<p class="sub" style="margin:0">날짜를 누르면 아래에 그날의 근무 구역과 섹터 순서가 나옵니다. 구역은 팀장이 공지한 날부터 표시됩니다.</p></div>';
}
function myTimeline(shift,g,i){
  const plan=mokpoPlan(shift);
  const rows=plan.map(b=>{const on=b.g===g;
    return '<div class="tl '+(on?'on':'off')+'"><div class="tt">'+fmtT(b.s)+' – '+fmtT(b.e)+' · '+(on?'근무':'휴식')+'</div>'+
      (on?'<div class="secs">'+b.slots.map(s=>'<span class="sec"><b>'+fmtT(s.s).replace('익일 ','')+'</b>'+esc(sectorFor(i,s.k))+'</span>').join('')+'</div>':'')+'</div>'}).join('');
  return '<div class="stack"><h3>목포구역 섹터 순서</h3><p class="sub" style="margin:0">'+(shift==='야간'?'야간: 섹터당 1시간, 3시간 근무 후 3시간 휴식':shift==='주간'?'주간: 섹터당 40분, 2시간 근무 후 2시간 휴식':'종일: 주간(40분·2시간) 후 야간(1시간·3시간) 로테이션')+'</p><div class="timeline">'+rows+'</div></div>';
}

function viewBoard(){
  if(!activeMembers().length)return emptyState('편성할 인원이 아직 없습니다',S.admin?'인원·경력 탭에서 인원을 등록하면 이 날짜의 근무팀 편성표를 만들 수 있습니다.':'팀장·서무가 인원을 등록하고 편성을 공지하면 여기에 표시됩니다.');
  const wt=workingTeams(S.date);
  return planPanel()+wt.map(t=>boardCard(S.date,t)).join('');
}
function boardCard(d,t){
  const st=teamStatus(t,d);const {doc,res}=resolved(d,t);const r=roster(d,t);
  const pub=doc&&doc.published;
  const state=pub?'<span class="flag ok">공지됨'+(doc.publishedAt?' · '+esc(doc.publishedAt.slice(5,16).replace('T',' ')):'')+'</span>':doc?'<span class="flag warn">작성 중 (근무자 비공개)</span>':'<span class="flag info">미작성</span>';
  let h='<section class="card board" id="board-'+t+'"><div class="board-head"><h3>'+t+'팀</h3>'+shBadge(st)+'<span class="sub num">'+SHIFT_TIME[st]+'</span>'+state+'</div>';
  const ld=leaders(t).map(m=>{const o=outDuty(d,m.id);return esc(m.role)+' <b>'+esc(m.name)+'</b>'+(o?' <span class="flag bad">'+esc(o.kind)+'</span>':'')}).join('');
  if(ld)h+='<div class="leaders">'+ld+'</div>';
  if(doc&&doc.chief){const ch=rotKeys(st).filter(k=>doc.chief[k]).map(k=>{const c=doc.chief[k];return (st==='종일'?(k==='day'?'주간 ':'야간 '):'')+'S <b>'+esc(c.S?nameOf(c.S):'—')+'</b> · T <b>'+esc(c.T?nameOf(c.T):'—')+'</b>'}).join(' / ');if(ch)h+='<div class="leaders"><span>10섹터(S·T) '+ch+'</span></div>'}

  h+=lineupHtml(d,t,st,res);
  if(!S.admin&&!pub){return h+emptyState('편성 공지 전입니다','팀장이 편성을 공지하면 이 자리에 바로 표시됩니다.')+'</section>'}

  if(S.edit){
    h+='<div class="row"><button class="btn primary sm" data-act="auto" data-t="'+t+'">경력 균형 자동 편성</button><button class="btn sm" data-act="copyprev" data-t="'+t+'">이전 편성 불러오기</button>'+
      (pub?'<button class="btn sm" data-act="unpub" data-t="'+t+'">공지 내리기</button>':'<button class="btn sm" data-act="pub" data-t="'+t+'"'+(doc?'':' disabled')+'>근무자에게 공지</button>')+
      '<button class="btn sm danger'+(S.armed==='clear'+t?' armed':'')+'" data-act="clear" data-t="'+t+'"'+(doc?'':' disabled')+'>'+(S.armed==='clear'+t?'한 번 더 누르면 비움':'편성 비우기')+'</button>'+
      '<span class="sub num" style="margin-left:auto">배치 '+placed+'/'+need+' · 가용 '+r.avail.length+'명</span></div>';
  }
  h+='<div class="areas">'+AREAS.map(a=>{
    return '<div class="area"><div class="area-h"><h4>'+a.n+'</h4><span>'+a.per+'명 × 2조</span></div>'+GROUPS.map(g=>{
      const cells=res[a.k][g];const iss=groupIssue(cells);
      return '<div class="grp"><div class="grp-h">'+g+'조'+(iss?' <span class="flag '+iss.sev+'">'+iss.msg+'</span>':'')+'</div><div class="cells">'+cells.map((c,i)=>cellHtml(d,t,a.k,g,i,c)).join('')+'</div></div>'}).join('')+'</div>'}).join('')+'</div>';
  if(S.admin){
    h+='<div class="stack"><h3>미배치 가용 인원 <span class="sub num">'+pool.length+'명</span></h3>'+(pool.length?'<div class="pool">'+pool.map(id=>'<span class="pchip">'+lvDot(id)+esc(nameOf(id))+(mem(id)&&+mem(id).team!==+t?' <span class="sub">대직</span>':'')+'</span>').join('')+'</div>':'<p class="sub" style="margin:0">모든 가용 인원이 배치되었습니다.</p>')+'</div>';

const PLAN_RULES=`이 자료는 해상 관제센터의 월간 근무계획표입니다. 날짜별로 주간 근무자, 야간 근무자, 변경사항을 읽어 주세요.
- day, night: 그 날짜의 주간 칸과 야간 칸에 적힌 이름을 적힌 순서(왼쪽에서 오른쪽, 위에서 아래) 그대로 공백으로 구분해 적습니다. 노란색 등으로 강조된 이름(대직으로 들어온 사람)은 이름 바로 뒤에 *를 붙입니다.
- chg: 변경사항 칸 항목을 "빠지는사람(주)-들어오는사람" 형태로 ; 로 구분합니다. (주)는 주간, (야)는 야간, (올)은 종일입니다. 없으면 "".
- why: 변경사유 칸 내용을 쉼표로 구분, 없으면 "".
- year, month: 제목에 보이면 숫자, 아니면 null.
- 흐린 글자는 아래 등록된 이름 목록을 참고해 가장 그럴듯하게 읽으세요. 날짜 행을 하나도 빠뜨리지 마세요.
JSON만 답하세요. 형식: {"year":2026,"month":9,"days":[{"d":1,"day":"홍길동 김관제 이해상*","night":"박바다 최등대","chg":"이해상(주)-김대직","why":"연가"}]}`;

function parsePlan(res,ym){
  const days=res&&Array.isArray(res.days)?res.days:[];
  let y=+ym.slice(0,4),mo=+ym.slice(5);
  if(res&&+res.month>=1&&+res.month<=12){mo=+res.month;if(+res.year>2000)y=+res.year}
  const dim=new Date(y,mo,0).getDate();const ymS=y+'-'+pad(mo);
  const names=s=>String(s||'').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean).map(x=>({n:x.replace(/[*＊]+$/,''),hl:/[*＊]$/.test(x)})).filter(x=>x.n);
  const chg=s=>String(s||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.+?)\s*\(\s*(주|야|올)\s*\)\s*[-–—→]\s*(.+)$/);return m?{out:m[1].trim(),sh:m[2],in:m[3].trim()}:{out:x,sh:'',in:''}});
  const out=[];days.forEach(x=>{const dd=parseInt(x.d,10);if(!(dd>=1&&dd<=dim))return;out.push({date:ymS+'-'+pad(dd),day:names(x.day),night:names(x.night),chg:chg(x.chg),why:String(x.why||'').trim()})});
  return {ym:ymS,days:out};
}
async function loadPlanFiles(fileList){
  const files=Array.from(fileList||[]).filter(Boolean);if(!files.length)return;
  if(files.some(f=>f.size>20*1024*1024)){S.planUp={err:'20MB 이하 파일만 읽을 수 있습니다.'};render();return}
  const ym=S.planYm||S.date.slice(0,7);S.planUp={reading:'파일을 읽는 중…'};render();
  const rest=[];let logs=0;
  for(const f of files){if(!['pdf','sheet','hwpx','odt','pptx'].includes(fileKind(f))){rest.push(f);continue}
    try{const d=await extractDoc(f);const lg=parseDutyLog(d.items&&d.items.length?d.items:rowsToItems(d.rows));
      if(!lg){rest.push(f);continue}
      S.planUp={reading:'근무일지를 편성표에 반영하는 중…'};render();
      const r=await applyDutyLog(lg,f.name);logs++;S.date=lg.date;S.meMonth=lg.date.slice(0,7);
      toast(fmtD(lg.date)+' 근무일지 반영 · '+(r.td?r.td+'팀 주간':'')+(r.tn&&r.tn!==r.td?' · '+r.tn+'팀 야간':'')+' · '+r.placed+'자리'+(r.duties?' · 대직 '+r.duties+'건':'')+(r.fixes.length?' · 이름 보정 '+r.fixes.join(', '):'')+(r.unknown.length?' · 미등록 '+r.unknown.join(', '):''));
    }catch(e){if(e instanceof ReadErr){S.planUp={err:e.message};render();return}rest.push(f)}}
  if(!rest.length){S.planUp={};render();return}
  try{const res=await readPlanFiles(rest);const p=parsePlan(res,ym);
    if(!p.days.length)throw new ReadErr('계획표에서 날짜별 근무자를 찾지 못했습니다.');
    const src=files.map(f=>f.name).join(', ');const now=new Date().toISOString();
    S.planUp={reading:'저장하는 중…'};render();
    await runBatch(p.days.map(x=>['plans/'+x.date,{...x,source:src,uploadedAt:now}]),'계획표 저장');
    S.planYm=p.ym;S.planUp={};
    const unk=new Set();p.days.forEach(x=>x.day.concat(x.night).forEach(n=>{if(!activeMembers().some(m=>m.name===n.n))unk.add(n.n)}));
    toast(+p.ym.slice(5)+'월 계획표 '+p.days.length+'일치를 불러왔습니다'+(unk.size?' · 미등록 이름 '+unk.size+'개':''));
    if(p.days[0]&&p.ym!==S.date.slice(0,7))S.date=p.days[0].date;
  }catch(e){S.planUp={err:e instanceof ReadErr?e.message:'계획표를 읽지 못했습니다. 다시 시도해 주세요.'}}
  render();
}

  const roster=[];leaders.forEach((_,i)=>{const ms=Object.keys(member).filter(x=>member[x]===i).sort((a,b)=>avg(a)-avg(b));
    ms.forEach((x,k)=>roster.push([x,String(num[i]),k===0&&avg(x)<1?'정팀장':k===1&&avg(x)<2?'부팀장':'근무자'].join('\t')))});
  let title='';for(let r=0;r<h;r++)title+=' '+(rows[r]||[]).map(str).join(' ');title+=' '+(hint||'');
  const mo=(title.match(/(\d{1,2})\s*월/)||[])[1],yr=(title.match(/(20\d{2})/)||[])[1];
  const mark=(arr)=>{const t=teamOfBlock(arr.length?arr:['']);return arr.map(x=>member[x]===t?x:x+'*').join(' ')};
  return {rosterLines:roster.join('\n'),teams:leaders.length,people:roster.length,
    plan:{year:yr?+yr:null,month:mo?+mo:null,days:days.map(x=>({d:x.d,day:x.day.length?mark(x.day):'',night:x.night.length?mark(x.night):'',chg:x.chg.join(';'),why:x.why.join(',')}))}};
}

    for(let k=0;k<n;k++){const y0=Math.max(0,Math.round(k*step)-ov),y1=Math.min(h,Math.round((k+1)*step)+ov);
      const sc=Math.min(1,2400/Math.max(w,y1-y0));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round((y1-y0)*sc);

  finally{URL.revokeObjectURL(url)}
}

/* ----- sheets ----- */
function renderSheet(){
  const s=S.sheet;if(!s)return;const p=$('#sheetPanel');
  if(s.kind==='slot')p.innerHTML=slotSheet();
  else if(s.kind==='duty')p.innerHTML=dutySheet();
  else if(s.kind==='person')p.innerHTML=personSheet();
  else if(s.kind==='bulk')p.innerHTML=bulkSheet();
  else if(s.kind==='pw')p.innerHTML=pwSheet();
}
function slotSheet(){
  const {d,t,a,g,i}=S.sheet;const {slots,res}=resolved(d,t);const cur=res[a][g][+i];const r=roster(d,t);const shown=shownIds(res);
  const pool=r.avail.filter(id=>!shown.includes(id)).sort(bySenior);
  const area=AREAS.find(x=>x.k===a);
  const others=[];AREAS.forEach(ar=>GROUPS.forEach(gg=>res[ar.k][gg].forEach((c,ii)=>{if(ar.k===a&&gg===g&&ii===+i)return;if(c.id)others.push({ar,gg,ii,c})})));
  const curTxt=!cur.id?'비어 있음':cur.tag==='out'?'결원 ('+nameOf(cur.id)+' '+cur.duty.kind+')':cur.tag==='sub'?nameOf(cur.shown)+' (대직)':nameOf(cur.id);
  return '<div class="sheet-h"><div><h2>'+t+'팀 '+area.n+' '+g+'조 · '+(+i+1)+'번</h2><div class="sub">'+fmtD(d)+' · 현재: '+esc(curTxt)+'</div></div><button class="btn sm" data-act="close">닫기</button></div>'+
  '<div class="stack"><h3>배치 가능 인원 <span class="sub">'+pool.length+'명</span></h3><div class="optlist">'+(pool.length?pool.map(id=>'<button class="opt" data-act="pick" data-id="'+esc(id)+'"><span class="l">'+lvDot(id)+esc(nameOf(id))+(mem(id)&&+mem(id).team!==+t?' <span class="flag info">'+mem(id).team+'팀 대직</span>':'')+'</span><span class="r">'+esc(expLabel(id))+'</span></button>').join(''):'<p class="sub" style="margin:0">남은 가용 인원이 없습니다. 아래에서 다른 자리와 맞바꿀 수 있습니다.</p>')+'</div></div>'+
  (others.length?'<details class="rot"><summary>다른 자리와 맞바꾸기</summary><div class="optlist" style="margin-top:10px">'+others.map(o=>'<button class="opt" data-act="swap" data-pos="'+o.ar.k+'|'+o.gg+'|'+o.ii+'"><span class="l">'+lvDot(o.c.shown||o.c.id)+esc(o.c.shown?nameOf(o.c.shown):nameOf(o.c.id)+' (결원)')+'</span><span class="r">'+o.ar.n.replace('구역','')+' '+o.gg+'조 '+(o.ii+1)+'번</span></button>').join('')+'</div></details>':'')+
  (cur.id?'<div class="row" style="justify-content:flex-end"><button class="btn danger" data-act="clearslot">자리 비우기</button></div>':'');
}

/* ---------- actions ---------- */
function setTab(t){S.tab=t;try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
function readForm(){if(!S.form)return;document.querySelectorAll('#sheetPanel [data-f]').forEach(el=>{const k=el.dataset.f;S.form[k]=el.type==='number'?el.value:el.value})}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  if(el.disabled)return;
  const armedBefore=S.armed;if(!['clear','deldute','delperson','unsample','delplan','deladmin'].includes(act))S.armed=null;
  const WRITE_ACTS=['bulkmove','mkacct','bulkacct','slot','pick','swap','clearslot','auto','copyprev','pub','unpub','clear','newduty','saveduty','deldute','newperson','newadmteam','editperson','saveperson','delperson','bulk','bulkfile','savebulk','savecfg','sample','unsample','chr','autoplan','delplan','setpin','clearpin','setdefpin','addadmin','deladmin','addhist','delhist'];
  if(WRITE_ACTS.includes(act)&&!S.edit&&S.session){if(act!=='editperson')toast('편집은 슈퍼관리자만 할 수 있습니다');return}
  switch(act){
    case 'tab':setTab(el.dataset.tab);break;
    case 'logout':logout();break;
    case 'addadmin':{if(!canManage())break;const raw=($('#admName')||{}).value||'';const names=raw.split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);if(!names.length){toast('관리자로 추가할 이름을 입력하세요');break}
      const miss=[],ops=[];names.forEach(n=>{const m=Object.values(S.members).find(x=>x.name===n);if(!m)miss.push(n);else if(!isAdminRole(m))ops.push(m)});
      for(const m of ops){try{await write('members/'+m.id,()=>S.db.doc('members/'+m.id).update({admin:true}))}catch(e){}}setTimeout(()=>syncRoles(ops.map(m=>m.id)),800);
      S.admAdd='';toast((ops.length?ops.map(m=>m.name).join(', ')+' 관리자 추가':'새로 추가된 사람이 없습니다')+(miss.length?' · 명단에 없는 이름: '+miss.join(', '):''));render(true);break}
    case 'deladmin':{const id=el.dataset.id;if(!canManage())break;if(isSuper(mem(id))){toast('슈퍼관리자는 인원·경력에서 직책을 바꿔야 해제됩니다');break}if(S.session&&S.session.mid===id){toast('지금 로그인한 본인은 관리자 명단에서 뺄 수 없습니다');break}
      if(armedBefore!=='adm'+id){S.armed='adm'+id;render(true);break}S.armed=null;try{await write('members/'+id,()=>S.db.doc('members/'+id).update({admin:false}));setTimeout(()=>syncRoles([id]),800);toast(nameOf(id)+' 관리자 권한을 해제했습니다')}catch(e){}break}
    case 'lmode':{S.login.mode=el.dataset.v;S.login.err='';const nm=$('#lgName');if(nm)S.login.name=nm.value;render(true);break}
    case 'mkacct':{const id=S.form&&S.form.id;const m=mem(id);const pin=($('#pPin')||{}).value||'';if(!m){toast('먼저 인원을 저장하세요');break}if(pin.length<6){toast('비밀번호는 6자 이상으로 정하세요');break}
      readForm();el.disabled=true;try{await createAccount(m,pin);toast(m.name+' 계정을 만들었습니다')}catch(e){toast(authMsg(e))}renderSheet();break}
    case 'bulkacct':{const pw=($('#bulkPw')||{}).value||'';if(pw.length<6){toast('비밀번호는 6자 이상으로 정하세요');break}
      const list=activeMembers().filter(m=>!accountOf(m.id));let ok=0,bad=[];for(let k=0;k<list.length;k++){S.busy='계정 만드는 중 '+(k+1)+'/'+list.length;render(true);try{await createAccount(list[k],pw);ok++}catch(e){bad.push(list[k].name)}}
      S.busy='';toast(ok+'명 계정을 만들었습니다'+(bad.length?' · 실패: '+bad.slice(0,5).join(', ')+(bad.length>5?' 외':''):''));render(true);break}
    case 'exportjson':exportJSON();break;
    case 'chpw':S.form={err:''};openSheet('pw',{});break;
    case 'dochpw':changePassword();break;
    case 'day':S.date=addDays(S.date,+el.dataset.n);render();break;
    case 'today':S.date=opDate();render();break;
    case 'medate':S.date=el.dataset.d;S.meMonth=S.date.slice(0,7);render();setTimeout(()=>{const x=$('#meDetail');if(x&&window.innerWidth<700)x.scrollIntoView({behavior:'smooth',block:'nearest'})},60);break;
    case 'mmonth':{const [y,mo]=(S.meMonth||S.date.slice(0,7)).split('-').map(Number);const d=new Date(y,mo-1+(+el.dataset.n),1);S.meMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'metoday':S.date=opDate();S.meMonth=S.date.slice(0,7);render();break;
    case 'goto':S.date=el.dataset.d;S.meMonth=S.date.slice(0,7);if(S.tab==='me'||S.tab==='status'){render();window.scrollTo({top:0})}break;
    case 'close':closeSheet();break;
    case 'chr':{const id=el.dataset.id,t=+el.dataset.t;S.pick=S.pick&&S.pick.id===id&&+S.pick.t===t&&S.pick.d===S.date?null:{d:S.date,t,id};render();break}
    case 'unpick':S.pick=null;render();break;
    case 'autoplan':{const t=+el.dataset.t,sh=el.dataset.sh;const p=planOf(S.date);if(!p)break;const ids=planWorkerIds(p,sh,t);if(!ids.length){toast('계획표에서 등록된 근무자를 찾지 못했습니다');break}
      const r=autoAssign(S.date,t,ids);S.pick=null;saveAssign(S.date,t,{slots:r.slots}).then(()=>toast(t+'팀 계획표 인원 '+r.placed+'명 배치'+(r.left?' · '+r.left+'명 자리 부족':''))).catch(()=>{});break}
    case 'delplan':{if(armedBefore!=='delplan'){S.armed='delplan';render();break}S.armed=null;const ym=S.planYm||S.date.slice(0,7);const ops=Object.values(S.plans).filter(x=>String(x.date).slice(0,7)===ym).map(x=>['plans/'+x.date,null]);try{await runBatch(ops,'계획표 삭제');toast('계획표를 지웠습니다')}catch(e){}break}
    case 'slot':if(!S.admin)return;
      if(S.pick&&S.pick.d===S.date&&+S.pick.t===+el.dataset.t){const t=+el.dataset.t,a=el.dataset.a,g=el.dataset.g,i=+el.dataset.i;const {slots}=resolved(S.date,t);const s=clone(slots);const id=S.pick.id;let from=null;
        AREAS.forEach(ar=>GROUPS.forEach(gg=>s[ar.k][gg].forEach((x,ii)=>{if(x===id)from=[ar.k,gg,ii]})));
        if(from)s[from[0]][from[1]][from[2]]=s[a][g][i];s[a][g][i]=id;S.pick=null;saveAssign(S.date,t,{slots:s}).then(()=>toast(nameOf(id)+' 배치')).catch(()=>{});break}
      openSheet('slot',{d:S.date,t:+el.dataset.t,a:el.dataset.a,g:el.dataset.g,i:+el.dataset.i});break;
    case 'pick':case 'swap':case 'clearslot':{
      const {d,t,a,g,i}=S.sheet;const {slots}=resolved(d,t);const s=clone(slots);
      if(act==='pick'){const id=el.dataset.id;s[a][g][i]=id}
      else if(act==='swap'){const [a2,g2,i2]=el.dataset.pos.split('|');const tmp=s[a2][g2][+i2];s[a2][g2][+i2]=s[a][g][i];s[a][g][i]=tmp}
      else s[a][g][i]=null;
      closeSheet();saveAssign(d,t,{slots:s}).catch(()=>{});break}
    case 'auto':{const t=+el.dataset.t;const r=autoAssign(S.date,t);saveAssign(S.date,t,{slots:r.slots}).then(()=>toast(t+'팀 '+r.placed+'명 배치 완료'+(r.left?' · '+r.left+'명 초과':''))).catch(()=>{});break}
    case 'copyprev':{const t=+el.dataset.t;const prev=Object.values(S.assigns).filter(x=>+x.team===t&&x.date<S.date).sort((a,b)=>a.date<b.date?1:-1)[0];
      if(!prev){toast('불러올 이전 편성이 없습니다');break}
      saveAssign(S.date,t,{slots:normSlots(prev.slots)}).then(()=>toast(fmtShort(prev.date)+' 편성을 불러왔습니다')).catch(()=>{});break}
    case 'pub':{const t=+el.dataset.t;saveAssign(S.date,t,{published:true,publishedAt:new Date(Date.now()+9*36e5).toISOString().replace('Z','')}).then(()=>toast(t+'팀 편성을 근무자에게 공지했습니다')).catch(()=>{});break}
    case 'unpub':{const t=+el.dataset.t;saveAssign(S.date,t,{published:false}).then(()=>toast('공지를 내렸습니다')).catch(()=>{});break}
    case 'clear':{const t=+el.dataset.t;if(armedBefore!=='clear'+t){S.armed='clear'+t;render();break}S.armed=null;saveAssign(S.date,t,{slots:emptySlots(),published:false}).catch(()=>{});break}
    case 'newduty':S.form={kind:'연가',team:workingTeams(S.date)[0]||1,mid:'',start:S.date,end:S.date,subId:'',note:''};openSheet('duty',{});break;
    case 'saveduty':{readForm();const f=S.form;const team=+f.team;const days=[];for(let d=f.start;d<=f.end&&days.length<62;d=addDays(d,1))if(isWork(teamStatus(team,d)))days.push(d);

    case 'bulkmove':{const t=+($('#bulkTeam')||{}).value;S.bulkTeam=t;const ids=Object.keys(S.sel).filter(id=>S.members[id]&&+S.members[id].team!==t);

      let ord=Object.values(S.members).filter(m=>+m.team===t).reduce((mx,m)=>Math.max(mx,m.order!=null?+m.order:-1),-1)+1;
      const fix=r=>t===0?(['슈퍼관리자','행정'].includes(r)?r:'행정'):(['정팀장','부팀장','근무자'].includes(r)?r:'근무자');
      el.disabled=true;let ok=0;for(const id of ids){const m=S.members[id];const patch={team:t,order:ord++};const nr=fix(m.role);if(nr!==m.role)patch.role=nr;
        S.busy='팀 변경 중 '+(ok+1)+'/'+ids.length;try{await write('members/'+id,()=>S.db.doc('members/'+id).update(patch));ok++}catch(e){break}}
      S.busy='';if(ok){toast(ok+'명을 '+teamName(t)+'(으)로 옮겼습니다');S.sel={}}render(true);break}
    case 'newadmteam':case 'newperson':{const tm=act==='newadmteam'?0:(S.peopleTeam==='all'?1:+S.peopleTeam);S.form={id:S.db.collection('members').doc().id,name:'',team:tm,role:tm===0?(hasSuper()?'행정':'슈퍼관리자'):'근무자',active:true,start:'',prior:0,memo:'',history:[]};openSheet('person',{});break}

    case 'addhist':{readForm();const d=$('#hDate').value,tx=$('#hText').value.trim();if(!tx){toast('경력 내용을 입력하세요');break}S.form.history.push({k:'h'+Date.now(),date:d||realToday,text:tx});renderSheet();break}
    case 'delhist':{readForm();S.form.history=S.form.history.filter(h=>h.k!==el.dataset.k);renderSheet();break}

async function makeSample(){
  const sur=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','홍','전','고','문','양'];
  const giv=['민준','서연','지훈','하은','도윤','수빈','현우','지민','준호','예린','성민','다은','태현','유진','동현','소율','재원','나연','상훈','가영','영호','미정','정우','혜진','승현','보람','경민','은지','진혁','수아'];
  const used=new Set(Object.values(S.members).map(m=>m.name));const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const nm=()=>{let n,k=0;do{n=rnd(sur)+rnd(giv);k++}while(used.has(n)&&k<200);used.add(n);return n};
  const ops=[],made=[];const sizes={1:19,2:17,3:19};
  [1,2,3].forEach(t=>{for(let k=0;k<sizes[t];k++){const role=k===0?'정팀장':k===1?'부팀장':'근무자';const id=S.db.collection('members').doc().id;
    const r=Math.random();const y=role!=='근무자'?14+Math.random()*10:r<.3?Math.random():r<.65?1+Math.random()*4:5+Math.random()*15;
    const start=addDays(realToday,-Math.round(y*365.25));
    ops.push(['members/'+id,{name:nm(),team:t,role,active:true,sample:true}]);
    ops.push(['careers/'+id,{start,prior:0,memo:'예시 데이터',history:[{k:'h0',date:start,text:'관제센터 발령 (예시)'}],sample:true}]);
    made.push({id,team:t,role})}});
  const busy={};const ws=t=>made.filter(m=>m.team===t&&m.role==='근무자');
  for(let i=0;i<7;i++){const d=addDays(opDate(),i);
    workingTeams(d).forEach(t=>{if(Math.random()<.35)return;
      const cand=ws(t).filter(m=>!busy[d+m.id]);const out=rnd(cand);busy[d+out.id]=1;
      const offs=made.filter(m=>m.role==='근무자'&&!isWork(teamStatus(m.team,d))&&!busy[d+m.id]);const sub=rnd(offs);
      const kind=rnd(['연가','연가','연가','교육훈련','특별휴가']);const withSub=kind==='연가'||Math.random()<.5;if(withSub&&sub)busy[d+sub.id]=1;
      const ref=S.db.collection('duties').doc();ops.push(['duties/'+ref.id,{date:d,team:t,kind,cat:kindCat(kind),mid:out.id,subId:withSub&&sub?sub.id:null,note:'예시',createdAt:new Date().toISOString(),sample:true}])});
    if(isWork(teamStatus(2,d))&&i<3){const offs=made.filter(m=>m.role==='근무자'&&!isWork(teamStatus(m.team,d))&&!busy[d+m.id]);const sub=rnd(offs);if(sub){busy[d+sub.id]=1;const ref=S.db.collection('duties').doc();ops.push(['duties/'+ref.id,{date:d,team:2,kind:'결원',cat:'기본',mid:null,subId:sub.id,note:'현원 부족 (예시)',createdAt:new Date().toISOString(),sample:true}])}}
  }
  try{await runBatch(ops,'예시 데이터 저장');toast('예시 데이터를 채웠습니다. 편성표에서 자동 편성을 눌러 보세요.')}catch(e){S.busy='';render()}
}
async function removeSample(){
  const ids=new Set(Object.values(S.members).filter(m=>m.sample).map(m=>m.id));const ops=[];
  ids.forEach(id=>{ops.push(['members/'+id,null]);ops.push(['careers/'+id,null])});
  S.duties.filter(x=>x.sample||ids.has(x.mid)||ids.has(x.subId)).forEach(x=>ops.push(['duties/'+x.id,null]));
  Object.entries(S.assigns).forEach(([k,a])=>{const s=normSlots(a.slots);let hit=false;AREAS.forEach(ar=>GROUPS.forEach(g=>s[ar.k][g].forEach(id=>{if(ids.has(id))hit=true})));if(hit)ops.push(['assign/'+k,null])});
  try{await runBatch(ops,'예시 데이터 삭제');toast('예시 데이터를 지웠습니다')}catch(e){S.busy='';render()}
}

  const acc=accountOf(f.id);
  return '<div class="stack pw-box"><h3>앱 계정</h3>'+(acc?'<p class="sub" style="margin:0"><span class="flag ok">계정 있음</span> 권한: '+esc(ROLE_LABEL[acc.role]||acc.role)+' · 로그인 이름 "'+esc(acc.name)+'"</p><p class="sub" style="margin:0">비밀번호는 본인이 로그인 후 머리글의 <b>비밀번호</b>에서 바꿉니다. 잊어버린 경우 Firebase 콘솔의 Authentication에서 이 사용자를 삭제하고 앱의 사용자 문서(users)도 지운 뒤 여기서 계정을 다시 만드세요.</p>':
    '<p class="sub" style="margin:0"><span class="flag warn">계정 없음</span> 처음 비밀번호를 정해 계정을 만들면 이름과 그 비밀번호로 로그인합니다.</p><div class="row"><input class="inp" type="password" id="pPin" autocomplete="new-password" placeholder="처음 비밀번호 (6자 이상)" style="flex:1;min-width:160px"><button class="btn sm" data-act="mkacct"'+(isNew?' disabled':'')+'>계정 만들기</button></div>'+(isNew?'<p class="sub" style="margin:0">인원을 저장한 뒤 계정을 만들 수 있습니다.</p>':''))+'</div>';
}
function dataCards(){
  const noAcc=activeMembers().filter(m=>!accountOf(m.id)).length;
  return '<div class="card stack"><h3>앱 계정</h3><p class="sub" style="margin:0">계정이 있어야 로그인할 수 있습니다. 계정 '+Object.keys(S.users).length+'개 · 계정 없는 인원 '+noAcc+'명</p>'+
    (S.edit?'<div class="row"><input class="inp" type="password" id="bulkPw" autocomplete="new-password" placeholder="공통 처음 비밀번호 (6자 이상)" style="flex:1;min-width:200px"><button class="btn primary" data-act="bulkacct"'+(noAcc?'':' disabled')+'>계정 없는 '+noAcc+'명 계정 만들기</button></div><p class="sub" style="margin:0">처음 비밀번호를 알려 주고, 로그인 후 머리글의 <b>비밀번호</b>에서 각자 바꾸게 하세요. 권한(슈퍼관리자·관리자·근무자)은 인원 정보와 관리자 명단에 맞춰 자동으로 정해집니다.</p>':'')+'</div>'+
    '<div class="card stack"><h3>데이터 가져오기 · 내보내기</h3><p class="sub" style="margin:0">claude.ai 버전에서 내보낸 <b>roster-data.json</b>을 가져오면 인원·경력·편성·대직·계획표·설정이 이 앱으로 옮겨집니다. 같은 이름의 인원은 하나로 합칩니다.</p>'+
    (S.edit?(S.busy?'<p class="num"><b>'+esc(S.busy)+'</b></p>':'<div class="row"><label class="btn" for="importFile">JSON 가져오기<input type="file" id="importFile" accept=".json,application/json" hidden></label><button class="btn" data-act="exportjson">JSON으로 내보내기</button></div>'):'')+'</div>';
}
async function importJSON(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('JSON 파일을 읽지 못했습니다');return}
  const C=data&&data.collections;if(!C||!C.members){toast('근무편성 데이터 파일이 아닙니다');return}
  const byName={};Object.values(S.members).forEach(m=>{byName[m.name]=m.id});
  const idMap={};Object.entries(C.members).forEach(([id,m])=>{idMap[id]=byName[m.name]||id});
  const R=id=>id&&idMap[id]?idMap[id]:id;const ops=[];
  Object.entries(C.members).forEach(([id,m])=>{const nid=R(id);const cur=S.members[nid];ops.push(['members/'+nid,cur&&cur.role==='슈퍼관리자'?{...m,role:'슈퍼관리자',team:cur.team,admin:true}:m])});
  Object.entries(C.careers||{}).forEach(([id,c])=>ops.push(['careers/'+R(id),c]));
  if(C.config&&C.config.main){const cf={...C.config.main};delete cf.defaultPin;ops.push(['config/main',cf])}
  Object.entries(C.duties||{}).forEach(([id,d])=>ops.push(['duties/'+id,{...d,mid:R(d.mid)||null,subId:R(d.subId)||null}]));
  Object.entries(C.assign||{}).forEach(([id,a])=>{const s=normSlots(a.slots);AREAS.forEach(ar=>GROUPS.forEach(g=>{s[ar.k][g]=s[ar.k][g].map(x=>x?R(x):null)}));ops.push(['assign/'+id,{...a,slots:s}])});
  Object.entries(C.plans||{}).forEach(([id,p])=>ops.push(['plans/'+id,p]));
  try{await runBatch(ops,'가져오는 중');await syncRoles();toast('데이터 '+ops.length+'건을 가져왔습니다')}catch(e){S.busy='';render()}
}
function exportJSON(){
  const col=o=>JSON.parse(JSON.stringify(o));const mem={};Object.values(S.members).forEach(m=>{const {id,...r}=m;mem[id]=r});
  const du={};S.duties.forEach(d=>{const {id,...r}=d;du[id]=r});const cf={...S.config};delete cf.defaultPin;
  const out={version:1,exportedAt:new Date().toISOString(),collections:{members:mem,careers:col(S.careers),config:{main:cf},duties:du,assign:col(S.assigns),plans:col(S.plans)}};
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='roster-data-'+realToday+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function adminListCard(){
  const list=Object.values(S.members).filter(isAdminRole).sort((a,b)=>(+a.team-+b.team)||byRole(a,b));
  const label=m=>m.role==='근무자'?'서무':m.role;if(!canManage())return '';
  const cand=Object.values(S.members).filter(m=>m.active!==false&&!isAdminRole(m)).map(m=>m.name).sort((a,b)=>a.localeCompare(b,'ko'));
  const rows=list.map(m=>{const me=S.session&&S.session.mid===m.id;return '<tr><td><b>'+esc(m.name)+'</b>'+(me?' <span class="flag info">나</span>':'')+'</td><td>'+teamPill(m.team)+'</td><td>'+esc(label(m))+'</td><td>'+(accountOf(m.id)?'<span class="flag ok">계정 있음</span>':'<span class="flag warn">계정 없음</span>')+'</td><td style="text-align:right">'+(isSuper(m)?'<span class="flag bad">고정</span>':me||!S.edit?'':'<button class="btn sm danger'+(S.armed==='adm'+m.id?' armed':'')+'" data-act="deladmin" data-id="'+esc(m.id)+'">'+(S.armed==='adm'+m.id?'해제 확인':'권한 해제')+'</button>')+'</td></tr>'}).join('');
  const per=[1,2,3].map(t=>'<span class="pill t'+t+'">'+t+'팀 '+list.filter(m=>+m.team===t).length+'명</span>').join('');
  return '<div class="card stack"><div class="row between"><div><h3>관리자 권한 명단</h3><p class="sub" style="margin:0">이 명단에 있는 사람만 관리자 모드로 로그인할 수 있습니다. 정팀장·부팀장은 처음부터 들어 있고, 서무는 이름을 입력해 추가합니다. 바꾼 권한은 앱 계정에 바로 반영됩니다.</p></div><div class="row">'+per+'</div></div>'+
    (!S.edit?'':'<div class="row"><input class="inp" id="admName" list="admNames" placeholder="이름 입력 (여러 명은 쉼표로)" style="flex:1;min-width:200px" autocomplete="off"><datalist id="admNames">'+cand.map(n=>'<option value="'+esc(n)+'"></option>').join('')+'</datalist><button class="btn primary" data-act="addadmin">관리자 추가</button></div>')+
    (list.length?'<div class="tscroll" style="margin:0"><table><thead><tr><th>이름</th><th>팀</th><th>구분</th><th>앱 계정</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="sub" style="margin:0">관리자 명단이 비어 있습니다.</p>')+
    '<p class="sub" style="margin:0">명단에 있는 사람은 관리자 모드로 모든 관리 화면을 볼 수 있고, 편집은 슈퍼관리자만 합니다.</p></div>';
}

/* ---------- boot ---------- */
let unsubs=[];
function stopData(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];S.members={};S.careers={};S.duties=[];S.assigns={};S.plans={};S.users={};S.loaded=false;S.live=false}
function startData(){
  stopData();const db=S.db;const onErr=e=>{S.live=false;if(e&&e.code==='permission-denied'){}render()};
  let got=0;const mark=()=>{got++;if(got>=2)S.live=true;render()};
  unsubs.push(db.doc('config/main').onSnapshot(s=>{S.config={...clone(DEF),...(s.exists?s.data():{})};mark()},onErr));
  unsubs.push(db.collection('members').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()}});S.members=o;S.loaded=true;mark();if(S.sheet&&S.sheet.kind==='slot')renderSheet()},onErr));
  unsubs.push(db.collection('users').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.users=o;const me=S.session&&o[S.session.uid];if(me&&S.profile&&me.role!==S.profile.role){S.profile=me;applySession()}render()},onErr));
  if(S.profile&&(S.profile.role==='admin'||S.profile.role==='super'))unsubs.push(db.collection('careers').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.careers=o;render()},onErr));
  unsubs.push(db.collection('duties').where('date','>=',cutoff).onSnapshot(s=>{S.duties=s.docs.map(d=>({id:d.id,...d.data()}));render();if(S.sheet&&S.sheet.kind==='slot')renderSheet()},onErr));
  unsubs.push(db.collection('plans').where('date','>=',cutoff).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.plans=o;render()},onErr));
  unsubs.push(db.collection('assign').where('date','>=',cutoff).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.assigns=o;render();if(S.sheet&&S.sheet.kind==='slot')renderSheet()},onErr));
}
async function onSignedIn(user){
  let snap;try{snap=await S.db.doc('users/'+user.uid).get()}catch(e){snap=null}
  if(!snap||!snap.exists){S.login.err='이 계정에 연결된 인원 정보가 없습니다. 슈퍼관리자에게 문의하세요.';S.login.busy=false;await firebase.auth().signOut();return}
  const p=snap.data();S.profile=p;
  let mode=S.pendingMode||lsGet('mode:'+user.uid)||'worker';S.pendingMode=null;
  if(p.role==='super')mode='admin';
  if(mode==='admin'&&p.role==='worker'){S.login.err='관리자 모드는 관리자 명단에 있는 사람만 쓸 수 있습니다. 근무자로 로그인하세요.';S.login.busy=false;S.login.mode='worker';await firebase.auth().signOut();return}
  lsSet('mode:'+user.uid,mode);
  S.session={uid:user.uid,mid:p.memberId,mode};applySession();
  S.tab=mode==='admin'?'board':'me';S.date=opDate();S.meMonth=S.date.slice(0,7);S.login.busy=false;S.login.err='';
  startData();toast((p.name||'')+'님, '+(S.edit?'슈퍼관리자':S.admin?'관리자':'근무자')+' 모드로 로그인했습니다');render(true);
}
render();
(async()=>{
  if(!window.firebase||!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey||/여기에|YOUR_/.test(window.FIREBASE_CONFIG.apiKey)){S.failed=true;S.failMsg='firebase-config.js에 Firebase 프로젝트 설정을 넣어 주세요. 설치 안내(README.md)를 참고하세요.';render(true);return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  S.db=firebase.firestore();
  try{S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  try{const o=await S.db.doc('meta/owner').get();S.needSetup=!o.exists}catch(e){S.needSetup=false}
  firebase.auth().onAuthStateChanged(async user=>{
    S.authReady=true;
    if(S.settingUp)return;
    if(user){await onSignedIn(user)}
    else{S.session=null;S.profile=null;S.admin=false;S.edit=false;stopData();render(true)}
  });
})();
})();

</script>
